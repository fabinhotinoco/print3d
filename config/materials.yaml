# Valores de projeto (não de fatiador). Calibrados pelo teste 000-teste-folgas (2026-11-12).
PLA_BAMBU_BASIC:
  density_g_cm3: 1.24
  clearance:            # folga radial por lado, mm — MEDIDO (pino 8 mm vertical em furo vertical)
    press_fit: 0.05     # permanente, entra com muita pressão (medido)
    snug_fit: 0.10      # pressão, removível (medido)
    slip_fit: 0.15      # entra folgado / desliza (medido)
    free_fit: 0.25      # gira solto, articulação (extrapolado — validar)
  hole_comp_mm: 0.00    # já embutido nas folgas medidas; usar só p/ furos de parafuso/inserto
  min_wall_mm: 1.2      # 3 perímetros de 0.42
  max_bridge_mm: 30
  max_overhang_deg: 50
